<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Staff Book" />
<meta name="theme-color" content="#1E3A5C" />
<title>Gyro City — Staff Book</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%2317395C'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>G</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --navy:#0E2A47; --navy2:#17395C; --blue:#2E6FA3; --sky:#7FB2DC;
    --olive:#5C6670; --olive2:#7A8590; --tomato:#B23A2A; --amber:#A66A00;
    --green:#1E7F4F; --ink:#131A22; --faint:#6B7683; --bg:#F5F6F8; --card:#FFFFFF; --line:#E3E6EB; --edge:#E3E6EB; --dim:#8A8378;
    --r:12px; --shadow:0 1px 2px rgba(19,26,34,.05),0 8px 24px -12px rgba(19,26,34,.10);
    --shadow-lg:0 2px 8px rgba(19,26,34,.06),0 18px 44px -16px rgba(19,26,34,.18);
    --disp:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{margin:0;color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;font-size:14.5px;
    background:var(--bg);font-variant-numeric:tabular-nums}
  .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
  .wrap{max-width:680px;margin:0 auto;padding:16px 16px calc(90px + env(safe-area-inset-bottom))}

  /* ---------- header ---------- */
  .hdr{background:var(--navy);color:#F4F6F8;
    padding:calc(18px + env(safe-area-inset-top)) 18px 0;position:relative;overflow:hidden;
    border-radius:0 0 14px 14px;box-shadow:var(--shadow-lg)}
  .hdr::before{content:'';position:absolute;width:340px;height:340px;border-radius:50%;
    background:radial-gradient(circle,rgba(127,178,220,.28),transparent 65%);top:-160px;right:-90px;pointer-events:none}
  .hdr::after{content:'';position:absolute;width:260px;height:260px;border-radius:50%;
    background:radial-gradient(circle,rgba(200,155,60,.22),transparent 65%);bottom:-120px;left:-70px;pointer-events:none}
  .hdr-in{max-width:680px;margin:0 auto;position:relative;z-index:1}
  .hrow{display:flex;justify-content:space-between;align-items:center}
  h1{margin:0;font-size:24px;font-weight:700;letter-spacing:.05em;font-family:var(--disp)}
  .greet{font-size:13.5px;color:#B9CCDE;margin-top:2px;font-weight:500}
  .tag{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.16em;color:#8FB0CC}
  .hello{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);
    color:#F4F6F3;border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;
    backdrop-filter:blur(8px);transition:transform .15s,background .2s}
  .hello:active{transform:scale(.95);background:rgba(255,255,255,.18)}
  .stores{display:flex;gap:5px;margin:16px 0 12px;background:rgba(0,0,0,.22);border-radius:14px;padding:5px}
  .stores button{flex:1;border:none;border-radius:10px;padding:10px 0;font-size:14px;font-weight:700;cursor:pointer;
    background:transparent;color:#A9BDD2;font-family:var(--disp);letter-spacing:.02em;transition:all .25s cubic-bezier(.5,1.5,.5,1)}
  .stores button.on{background:#F4F6F3;color:var(--navy);box-shadow:0 3px 10px rgba(0,0,0,.28);transform:scale(1.02)}
  .wknav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .wknav .arrow{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.14);color:#F4F6F3;border-radius:12px;
    width:42px;height:42px;font-size:18px;cursor:pointer;transition:transform .15s}
  .wknav .arrow:active{transform:scale(.9)}
  .wkmid{flex:1;text-align:center}
  .wkmid b{font-size:16px;font-family:var(--disp)}
  .wkmid .sub{font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.12em;color:#8FB0CC;margin-top:3px}
  .wkmid .sub.pub{color:#8FD69B}
  .tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 0 12px;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{background:transparent;color:#8FA6BC;border:none;border-bottom:2px solid transparent;border-radius:0;
    padding:10px 12px 12px;font-size:11.5px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;
    cursor:pointer;white-space:nowrap;transition:all .18s;font-family:'Inter',sans-serif}
  .tabs button.on{background:transparent;color:#FFFFFF;border-bottom-color:#F4F6F8;box-shadow:none}
  .meander{height:0}
  .storebar{position:fixed;top:0;left:0;right:0;height:3px;z-index:300;pointer-events:none}
  .storepill{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:250;
    border:none;border-radius:999px;padding:10px 16px;font-size:11px;font-weight:800;letter-spacing:.12em;
    color:#fff;cursor:pointer;font-family:'Inter',sans-serif;box-shadow:0 6px 20px -6px rgba(19,26,34,.45);
    display:flex;align-items:center;gap:7px;transition:transform .12s}
  .storepill:active{transform:scale(.96)}

  /* ---------- cards & inputs ---------- */
  .card{background:var(--card);border:1px solid rgba(228,224,212,.8);border-radius:var(--r);padding:16px;margin-bottom:14px;
    box-shadow:var(--shadow);animation:rise .35s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .lbl{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.14em;color:var(--faint);margin-bottom:9px}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{border:1.5px solid var(--line);background:#FBFAF6;color:var(--ink);border-radius:999px;padding:9px 15px;font-size:14px;
    cursor:pointer;font-family:inherit;font-weight:500;transition:all .18s}
  .chip:active{transform:scale(.94)}
  .chip.on{background:linear-gradient(135deg,var(--navy) 0%,var(--blue) 100%);border-color:transparent;color:#fff;font-weight:700;
    box-shadow:0 4px 12px rgba(23,57,92,.35)}
  input,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;font-size:16px;font-family:inherit;
    color:var(--ink);background:#FBFAF6;outline:none;transition:border .2s,box-shadow .2s}
  input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(46,111,163,.12)}
  .btn{border:none;border-radius:13px;padding:13px 18px;font-size:15px;font-weight:700;cursor:pointer;color:#fff;
    background:linear-gradient(135deg,var(--navy) 0%,var(--blue) 130%);font-family:var(--disp);letter-spacing:.01em;
    box-shadow:0 6px 16px -4px rgba(23,57,92,.4);transition:transform .15s,box-shadow .2s,filter .2s}
  .btn:active{transform:scale(.965);filter:brightness(1.08)}
  .btn.blue{background:linear-gradient(135deg,var(--blue),#4a8cc0)}
  .btn.olive{background:linear-gradient(135deg,#5E6C38,var(--olive2));box-shadow:0 6px 16px -4px rgba(111,122,69,.45)}
  .btn.wide{width:100%;display:block}
  .btn[disabled]{opacity:.55}
  .ghost{background:none;border:none;color:var(--faint);font-size:14px;cursor:pointer;font-family:inherit}

  /* ---------- schedule ---------- */
  .days{display:flex;gap:7px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .day{min-width:66px;border:1px solid rgba(228,224,212,.8);border-radius:14px;padding:9px 0 8px;background:var(--card);
    color:var(--ink);font-weight:700;font-size:14px;cursor:pointer;box-shadow:var(--shadow);font-family:var(--disp);transition:all .2s}
  .day:active{transform:scale(.94)}
  .day.on{background:linear-gradient(150deg,var(--navy),var(--blue));color:#fff;border-color:transparent;transform:translateY(-2px);
    box-shadow:0 8px 20px -6px rgba(23,57,92,.5)}
  .day .sub{font-family:ui-monospace,Menlo,monospace;font-size:9.5px;font-weight:400;color:var(--faint);margin-top:3px}
  .day.on .sub{color:#B9CCDE}
  .dayhdr{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.12em;color:var(--faint);margin:2px 2px 12px}
  .pos{background:var(--card);border:1px solid rgba(228,224,212,.8);border-radius:var(--r);margin-bottom:14px;
    box-shadow:var(--shadow);overflow:hidden;border-left:5px solid;animation:rise .35s ease both}
  .pos-h{padding:9px 16px;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.16em;font-weight:700}
  .pos-b{padding:8px 14px 13px}
  .shift{display:flex;width:100%;justify-content:space-between;align-items:center;background:#FBFAF6;border:1.5px solid var(--line);
    border-radius:12px;padding:12px 13px;margin-top:8px;text-align:left;font-size:15.5px;gap:8px}
  .shift .t{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--faint);white-space:nowrap}
  .avgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-bottom:14px}
  .avday{border:1px solid rgba(228,224,212,.8);border-radius:14px;padding:13px 0 11px;background:var(--card);color:var(--ink);
    font-weight:700;font-size:13.5px;cursor:pointer;box-shadow:var(--shadow);font-family:var(--disp);transition:all .22s cubic-bezier(.5,1.6,.5,1)}
  .avday:active{transform:scale(.9)}
  .avday.yes{background:linear-gradient(150deg,#5E6C38,var(--olive2));color:#fff;border-color:transparent;transform:translateY(-2px);
    box-shadow:0 8px 18px -6px rgba(111,122,69,.55)}
  .avday.no{background:linear-gradient(150deg,#E9D3CD,#F2E2DD);color:var(--tomato);border-color:transparent}
  .avday .sub{font-family:ui-monospace,Menlo,monospace;font-size:8.5px;font-weight:400;margin-top:3px;opacity:.85}
  .avday .mark{font-size:15px;margin-top:4px}

  /* ---------- misc ---------- */
  .banner{border-radius:13px;padding:11px 15px;font-size:14px;margin-bottom:14px;line-height:1.55}
  .banner.err{background:#FBE9E4;color:var(--tomato);border:1px solid #F2CFC5}
  .toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    background:linear-gradient(135deg,#5E6C38,var(--olive2));color:#fff;border-radius:999px;padding:11px 24px;font-size:14px;
    font-weight:700;box-shadow:0 10px 30px -6px rgba(0,0,0,.35);z-index:60;animation:pop .3s cubic-bezier(.5,1.6,.5,1)}
  @keyframes pop{from{opacity:0;transform:translate(-50%,14px) scale(.9)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
  .muted{color:var(--faint);font-size:13.5px;line-height:1.55}
  .center{text-align:center;color:var(--faint);font-size:14.5px;padding:18px 0;line-height:1.6}
  .vd-pick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
  .vd-pick button{flex:1;min-width:92px;border:1.5px solid var(--line);background:#FBFAF6;border-radius:12px;padding:12px 8px;
    font-size:14.5px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit;text-align:center;transition:all .15s}
  .vd-pick button.on{background:linear-gradient(135deg,var(--navy),var(--blue));border-color:transparent;color:#fff}
  .vd-file{display:block;text-align:center;border:1.5px dashed #CFD5DD;background:#FBFAF6;border-radius:13px;padding:15px;
    font-weight:700;color:var(--navy);cursor:pointer;font-size:14.5px}
  .vd-shots{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .vd-tw{position:relative;display:inline-block;line-height:0}
  .vd-tw img{width:68px;height:68px;object-fit:cover;border-radius:11px;border:1px solid var(--line)}
  .vd-tw .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--tomato);
    color:#fff;border:none;font-size:12px;line-height:1;cursor:pointer;padding:0}
  .pick{display:flex;width:100%;align-items:center;gap:13px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;
    padding:11px 13px;margin-bottom:9px;cursor:pointer;text-align:left;font-family:inherit;font-size:inherit;
    box-shadow:var(--shadow);transition:all .18s}
  .pick:active{transform:scale(.975)}
  .pick .ico{width:48px;height:48px;min-width:48px;border-radius:14px;background:linear-gradient(145deg,#F6F3EA,#EDE8DA);
    display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:inset 0 1px 2px rgba(255,255,255,.8)}
  .pick .nm{flex:1;font-size:15px;font-weight:600;line-height:1.3}
  .pick .pr{font-size:12.5px;color:var(--faint);font-weight:400;margin-top:1px}
  .pill{font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.12em;color:#fff;border-radius:6px;padding:4px 8px;white-space:nowrap}
  .plus{color:var(--sky);font-size:24px;padding:0 8px;font-weight:300}
  .row{display:flex;gap:8px}.row>*{flex:1}

  /* ---------- punch-in ---------- */
  .login{min-height:100vh;display:flex;flex-direction:column;align-items:center;
    background:linear-gradient(160deg,#0A1F38 0%,#17395C 55%,#235285 100%);
    padding:calc(40px + env(safe-area-inset-top)) 18px 44px;position:relative;overflow:hidden}
  .login::before{content:'';position:absolute;width:520px;height:520px;border-radius:50%;
    background:radial-gradient(circle,rgba(127,178,220,.22),transparent 62%);top:-220px;right:-160px;animation:drift 14s ease-in-out infinite alternate}
  .login::after{content:'';position:absolute;width:440px;height:440px;border-radius:50%;
    background:radial-gradient(circle,rgba(200,155,60,.2),transparent 62%);bottom:-190px;left:-140px;animation:drift 17s ease-in-out infinite alternate-reverse}
  @keyframes drift{from{transform:translate(0,0)}to{transform:translate(36px,26px)}}
  .login h1{color:#F4F6F3;margin:12px 0 2px;font-family:var(--disp);letter-spacing:.06em}
  .login .tag{margin-bottom:26px}
  .lcard{background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.6);
    border-radius:26px;padding:24px 20px;width:100%;max-width:420px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);
    position:relative;z-index:1;animation:rise .4s ease both}
  .namegrid{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .namegrid .chip{padding:12px 17px;font-size:15px}
  .whoami{text-align:center;font-size:20px;font-weight:700;color:var(--navy);margin-bottom:4px;font-family:var(--disp)}
  .pinsub{text-align:center;font-size:13.5px;color:var(--faint);margin-bottom:16px;line-height:1.55}
  .dots{display:flex;gap:15px;justify-content:center;margin:6px 0 20px}
  .dot{width:15px;height:15px;border-radius:50%;border:2px solid var(--line);background:transparent;transition:all .15s cubic-bezier(.5,1.6,.5,1)}
  .dot.f{background:linear-gradient(135deg,var(--navy),var(--blue));border-color:transparent;transform:scale(1.18);
    box-shadow:0 2px 8px rgba(23,57,92,.4)}
  .dots.bad .dot{border-color:var(--tomato);background:#F7E5E1;animation:shake .32s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;max-width:282px;margin:0 auto}
  .key{border:1px solid var(--line);border-radius:18px;background:#FBFAF6;color:var(--ink);font-size:23px;font-weight:600;
    padding:16px 0;cursor:pointer;font-family:var(--disp);box-shadow:0 2px 5px rgba(14,42,71,.07);transition:all .12s}
  .key:active{transform:scale(.9);background:#EFEBDF;box-shadow:none}
  .key.ghostk{background:transparent;border-color:transparent;box-shadow:none;font-size:18px;color:var(--faint)}
  .backl{background:none;border:none;color:#9FBBD4;font-size:13.5px;cursor:pointer;margin-top:18px;position:relative;z-index:1;font-family:inherit}

  /* ---------- game ---------- */
  .garea{position:relative;height:440px;border-radius:18px;overflow:hidden;touch-action:none;box-shadow:var(--shadow-lg);
    background:linear-gradient(180deg,#0E2A47 0%,#17395C 55%,#2E6FA3 100%);cursor:pointer}
  .slayer{position:absolute;height:24px;border-radius:6px;
    box-shadow:0 3px 7px -2px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.3)}
  .gitem{position:absolute;font-size:30px;transform:translate(-50%,-50%);pointer-events:none;user-select:none;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  .gpaddle{position:absolute;bottom:6px;font-size:46px;transform:translateX(-50%);pointer-events:none;user-select:none;
    filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}
  .ghud{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;
    font-family:var(--disp);font-size:15px;color:#fff;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.5)}
  .gover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(10,31,56,.85);backdrop-filter:blur(6px);color:#fff;text-align:center;padding:20px}
  .lb{width:100%;max-width:280px;margin-top:12px}
  .lbrow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.14);font-size:14px}
  .mt8{margin-top:8px}.mt10{margin-top:10px}.mb8{margin-bottom:8px}.mb10{margin-bottom:10px}.mb12{margin-bottom:12px}

  /* ===== Backyard — namespaced by- ; Staff Book already defines .row/.card/.chip/.banner/.toast ===== */
  .by-sub{display:flex;gap:6px;margin-bottom:14px}
  .by-sub button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--faint);border-radius:9px;
    padding:9px 0;font-size:12px;font-weight:800;letter-spacing:.1em;cursor:pointer;font-family:inherit}
  .by-sub button.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .by-srow{display:flex;gap:9px;margin-bottom:14px}
  .by-search{flex:1;min-width:0;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);
    color:var(--ink);outline:none;font-size:15px;font-family:inherit}
  .by-search:focus{border-color:var(--navy)}
  .by-mode{flex:none;display:flex;align-items:center;gap:6px;padding:0 14px;border:1px solid var(--navy);border-radius:10px;
    color:var(--navy);background:var(--card);font-size:13px;font-weight:800;letter-spacing:.06em;cursor:pointer;font-family:inherit}
  .by-mode svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .by-cat{margin-bottom:20px}
  .by-cath{display:flex;align-items:center;justify-content:space-between;padding:0 2px 7px}
  .by-cath .nme{font-size:14px;font-weight:800;letter-spacing:.1em;color:var(--navy)}
  .by-cath .need{font-size:11.5px;font-weight:800;letter-spacing:.08em;color:#B3261E}
  .by-card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .by-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #EEEDE9}
  .by-row > :first-child{flex:1 1 auto;min-width:0}
  .by-row:last-child{border-bottom:none}
  .by-nm{font-weight:600;font-size:14.5px;line-height:1.2}
  .by-meta{font-size:11.5px;color:var(--faint);margin-top:2px}
  .by-seg{display:flex;flex:none;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .by-seg button{font-size:12px;font-weight:800;letter-spacing:.06em;padding:8px 0;width:48px;color:#98A0AB;
    background:#F7F6F3;border:none;cursor:pointer;font-family:inherit}
  .by-seg button + button{border-left:1px solid var(--line)}
  .by-seg button.g-on{background:#1F6E43;color:#fff}
  .by-seg button.l-on{background:#A66A00;color:#fff}
  .by-seg button.o-on{background:#B3261E;color:#fff}
  .by-chead{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--navy);color:#fff;
    border-radius:10px;padding:12px 14px;margin-bottom:14px}
  .by-chead .l{font-size:15px;font-weight:800;letter-spacing:.06em}
  .by-chead .r{font-size:11.5px;opacity:.85;text-align:right;line-height:1.5}
  .by-cin{width:74px;text-align:center;font-size:17px;font-weight:600;padding:9px 6px;border:1px solid var(--line);
    border-radius:9px;background:#FBFAF8;outline:none;flex:none;font-family:inherit}

  function compressImage(file){
    return new Promise((res,rej)=>{
      const img=new Image();
      img.onload=()=>{
        const max=2400;
        let w=img.width,h=img.height;
        if(w>max||h>max){const k=max/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k);}
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        cv.toBlob(b=>b?res(b):rej(new Error('compress failed')),'image/jpeg',0.85);
      };
      img.onerror=()=>rej(new Error('could not read image'));
      img.src=URL.createObjectURL(file);
    });
  }

  function startGame(){
    const st={on:true,over:false,score:0,
      layers:[{x:0.30,w:0.40,c:STACK_COLORS[0]}],
      cur:{x:0,w:0.40,c:STACK_COLORS[1],dir:1},
      speed:0.00075,t:performance.now()};
    gRef.current=st;setG({...st});

  function stackTick(now){
    const st=gRef.current;
    if(!st||!st.on)return;
    const dt=Math.min(40,now-st.t);st.t=now;
    const range=1-st.cur.w;
    st.cur.x+=st.cur.dir*st.speed*dt;
    if(st.cur.x<=0){st.cur.x=0;st.cur.dir=1;}
    else if(st.cur.x>=range){st.cur.x=range;st.cur.dir=-1;}
    setG({...st});
    loopRef.current=requestAnimationFrame(stackTick);
  }
  function dropLayer(){
    const st=gRef.current;
    if(!st||!st.on)return;
    const top=st.layers[st.layers.length-1];
    const left=Math.max(st.cur.x,top.x);
    const right=Math.min(st.cur.x+st.cur.w,top.x+top.w);
    const w=right-left;
    if(w<=0.002){
      st.on=false;st.over=true;setG({...st});
      const best=Number(scores?.[authed]||0);
      if(scores!==null&&st.score>best){setDoc(D('gamescores'),{best:{...scores,[authed]:st.score}}).catch(()=>{});}
      return;
    }
    const perfect=Math.abs(st.cur.x-top.x)<0.02;
    const nx=perfect?top.x:left, nw=perfect?st.cur.w:w;
    st.layers.push({x:nx,w:nw,c:st.cur.c});
    st.score+=1;
    st.cur={x:0,w:nw,c:STACK_COLORS[(st.score+1)%STACK_COLORS.length],dir:1};
    st.speed=Math.min(0.0022,0.00075+st.score*0.00004);
    setG({...st});
  }

      <div class="card" style="padding:12px 14px">
        <b style="font-size:16px">Gyro Stack</b>
        <div class="muted" style="margin-top:3px">Tap to drop each layer. Line it up — whatever hangs over the edge gets trimmed. Build the tallest gyro you can.</div>
      </div>
      <div class="garea" onPointerDown=${dropLayer}>
        ${g.on&&html`
          <div class="ghud" style="justify-content:center"><span style="font-size:36px;font-weight:800">${g.score}</span></div>
          ${(g.layers||[]).map((L,j)=>html`<div class="slayer" key=${j} style=${{background:L.c,left:(L.x*100)+'%',width:(L.w*100)+'%',top:(90+(g.layers.length-j)*26)+'px'}}></div>`)}
          ${g.cur&&html`<div class="slayer" style=${{background:g.cur.c,left:(g.cur.x*100)+'%',width:(g.cur.w*100)+'%',top:'90px'}}></div>`}
        `}
        ${!g.on&&html`
          <div class="gover">
            ${g.over?html`
              <div style="font-size:20px;font-weight:800">Nice tower!</div>
              <div style="font-size:34px;font-weight:800;margin:6px 0">${g.score}</div>
              <div style="font-size:13.5px;opacity:.85">${g.score>=(Number(scores?.[authed])||0)&&g.score>0?'New personal best ✨':'Best: '+(scores?.[authed]||0)}</div>
            `:html`
              <div style="font-size:19px;font-weight:800;margin:6px 0 2px">Gyro Stack</div>
              <div style="font-size:13.5px;opacity:.85">Your best: ${scores?.[authed]||0}</div>
            `}
            <button class="btn olive" style="margin-top:14px;padding:13px 34px;font-size:16px" onClick=${startGame}>${g.over?'Play again':'START'}</button>
            ${topScores.length>0&&html`
              <div class="lb">
                <div style="font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.12em;opacity:.7;margin-bottom:4px">LEADERBOARD</div>
                ${topScores.map(([n,s],i)=>html`
                  <div class="lbrow" key=${n}><span>${i+1}. ${n}${n===authed?' (you)':''}</span><b>${s}</b></div>`)}
              </div>`}
          </div>
        `}
      </div>
    <//>`;

  const STORE_COL={astoria:'#0E2A47',macdougal:'#1F5F52'};
  const storeSignal=html`
    <${Fragment}>
      <div class="storebar" style=${{background:STORE_COL[store]}}></div>
      <button class="storepill" style=${{background:STORE_COL[store]}}
        onClick=${()=>{const n2=store==='astoria'?'macdougal':'astoria';setStore(n2);localStorage.setItem('gc-store',n2);}}>
        ${store==='astoria'?'ASTORIA':'MACDOUGAL'}<span style="opacity:.7">⇄</span>
      </button>
    <//>`;
  return html`
    <${Fragment}>
      ${header}
      <div class="wrap">
        ${connected===false&&html`<div class="banner err"><b>Can't reach the database.</b> Check your internet connection.</div>`}
        ${err&&html`<div class="banner err">${err}</div>`}
        ${tab==='foodie'?foodieTab:tab==='inv'?invTab:tab==='backyard'?backyardTab:tab==='avail'?availTab:tab==='game'?gameTab:tab==='idea'?ideaTab:weekTab}
      </div>
      ${storeSignal}
      ${toast&&html`<div class="toast">${toast}</div>`}
    <//>`;
}

render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
