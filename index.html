<!DOCTYPE html>

<style>

    --olive:#6F7A45; --olive2:#8A9A55; --tomato:#C0442E; --amber:#C89B3C;
    --ink:#1B2430; --faint:#75808F; --bg:#F4F1E9; --card:#FFFFFF; --line:#E4E0D4;

    --shadow-lg:0 4px 12px rgba(14,42,71,.08),0 24px 60px -18px rgba(14,42,71,.28);

  }

  html{scroll-behavior:smooth}
  body{margin:0;color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;font-size:15px;

                     radial-gradient(700px 420px at -15% 20%,rgba(200,155,60,.10),transparent 55%);

  .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
  .wrap{max-width:680px;margin:0 auto;padding:16px 16px calc(90px + env(safe-area-inset-bottom))}

  /* ---------- header ---------- */
  .hdr{background:linear-gradient(135deg,#0C2440 0%,#17395C 55%,#1F4A75 100%);color:#F4F6F3;
    padding:calc(18px + env(safe-area-inset-top)) 18px 0;position:relative;overflow:hidden;
    border-radius:0 0 26px 26px;box-shadow:var(--shadow-lg)}
  .hdr::before{content:'';position:absolute;width:340px;height:340px;border-radius:50%;
    background:radial-gradient(circle,rgba(127,178,220,.28),transparent 65%);top:-160px;right:-90px;pointer-events:none}
  .hdr::after{content:'';position:absolute;width:260px;height:260px;border-radius:50%;
    background:radial-gradient(circle,rgba(200,155,60,.22),transparent 65%);bottom:-120px;left:-70px;pointer-events:none}
  .hdr-in{max-width:680px;margin:0 auto;position:relative;z-index:1}
  .hrow{display:flex;justify-content:space-between;align-items:center}
  h1{margin:0;font-size:24px;font-weight:700;letter-spacing:.05em;font-family:var(--disp)}
  .greet{font-size:13.5px;color:#B9CCDE;margin-top:2px;font-weight:500}
  .tag{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.16em;color:#8FB0CC}
  .hello{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);
    color:#F4F6F3;border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;
    backdrop-filter:blur(8px);transition:transform .15s,background .2s}
  .hello:active{transform:scale(.95);background:rgba(255,255,255,.18)}
  .stores{display:flex;gap:5px;margin:16px 0 12px;background:rgba(0,0,0,.22);border-radius:14px;padding:5px}
  .stores button{flex:1;border:none;border-radius:10px;padding:10px 0;font-size:14px;font-weight:700;cursor:pointer;
    background:transparent;color:#A9BDD2;font-family:var(--disp);letter-spacing:.02em;transition:all .25s cubic-bezier(.5,1.5,.5,1)}
  .stores button.on{background:#F4F6F3;color:var(--navy);box-shadow:0 3px 10px rgba(0,0,0,.28);transform:scale(1.02)}
  .wknav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .wknav .arrow{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.14);color:#F4F6F3;border-radius:12px;
    width:42px;height:42px;font-size:18px;cursor:pointer;transition:transform .15s}
  .wknav .arrow:active{transform:scale(.9)}
  .wkmid{flex:1;text-align:center}
  .wkmid b{font-size:16px;font-family:var(--disp)}
  .wkmid .sub{font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.12em;color:#8FB0CC;margin-top:3px}
  .wkmid .sub.pub{color:#8FD69B}
  .tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:0 0 12px;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{background:rgba(255,255,255,.07);color:#A9BDD2;border:1px solid rgba(255,255,255,.10);border-radius:999px;
    padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s;font-family:'Inter',sans-serif}
  .tabs button.on{background:#F4F6F3;color:var(--navy);font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  .meander{height:0}

  .card{background:var(--card);border:1px solid rgba(228,224,212,.8);border-radius:var(--r);padding:16px;margin-bottom:14px;
    box-shadow:var(--shadow);animation:rise .35s ease both}

  .lbl{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.14em;color:var(--faint);margin-bottom:9px}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{border:1.5px solid var(--line);background:#FBFAF6;color:var(--ink);border-radius:999px;padding:9px 15px;font-size:14px;
    cursor:pointer;font-family:inherit;font-weight:500;transition:all .18s}

  .chip.on{background:linear-gradient(135deg,var(--navy) 0%,var(--blue) 100%);border-color:transparent;color:#fff;font-weight:700;
    box-shadow:0 4px 12px rgba(23,57,92,.35)}
  input,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;font-size:16px;font-family:inherit;

  .btn[disabled]{opacity:.55}
  .ghost{background:none;border:none;color:var(--faint);font-size:14px;cursor:pointer;font-family:inherit}

    border-radius:12px;padding:12px 13px;margin-top:8px;text-align:left;font-size:15.5px;gap:8px}

  .avgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-bottom:14px}
  .avday{border:1px solid rgba(228,224,212,.8);border-radius:14px;padding:13px 0 11px;background:var(--card);color:var(--ink);

  .muted{color:var(--faint);font-size:13.5px;line-height:1.55}
  .center{text-align:center;color:var(--faint);font-size:14.5px;padding:18px 0;line-height:1.6}

  .login::after{content:'';position:absolute;width:440px;height:440px;border-radius:50%;
    background:radial-gradient(circle,rgba(200,155,60,.2),transparent 62%);bottom:-190px;left:-140px;animation:drift 17s ease-in-out infinite alternate-reverse}
  @keyframes drift{from{transform:translate(0,0)}to{transform:translate(36px,26px)}}
  .login h1{color:#F4F6F3;margin:12px 0 2px;font-family:var(--disp);letter-spacing:.06em}

  .lcard{background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.6);

  .whoami{text-align:center;font-size:20px;font-weight:700;color:var(--navy);margin-bottom:4px;font-family:var(--disp)}
  .pinsub{text-align:center;font-size:13.5px;color:var(--faint);margin-bottom:16px;line-height:1.55}
  .dots{display:flex;gap:15px;justify-content:center;margin:6px 0 20px}
  .dot{width:15px;height:15px;border-radius:50%;border:2px solid var(--line);background:transparent;transition:all .15s cubic-bezier(.5,1.6,.5,1)}
  .dot.f{background:linear-gradient(135deg,var(--navy),var(--blue));border-color:transparent;transform:scale(1.18);

  .dots.bad .dot{border-color:var(--tomato);background:#F7E5E1;animation:shake .32s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;max-width:282px;margin:0 auto}
  .key{border:1px solid var(--line);border-radius:18px;background:#FBFAF6;color:var(--ink);font-size:23px;font-weight:600;
    padding:16px 0;cursor:pointer;font-family:var(--disp);box-shadow:0 2px 5px rgba(14,42,71,.07);transition:all .12s}
  .key:active{transform:scale(.9);background:#EFEBDF;box-shadow:none}
  .key.ghostk{background:transparent;border-color:transparent;box-shadow:none;font-size:18px;color:var(--faint)}
  .backl{background:none;border:none;color:#9FBBD4;font-size:13.5px;cursor:pointer;margin-top:18px;position:relative;z-index:1;font-family:inherit}

  /* ---------- game ---------- */
  .garea{position:relative;height:440px;border-radius:22px;overflow:hidden;touch-action:none;box-shadow:var(--shadow-lg);
    background:linear-gradient(180deg,#0E2A47 0%,#2E5C8A 62%,#3d70a0 70%,#E8DFC8 70.2%,#DFD4B8 100%)}
  .gitem{position:absolute;font-size:30px;transform:translate(-50%,-50%);pointer-events:none;user-select:none;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  .gpaddle{position:absolute;bottom:6px;font-size:46px;transform:translateX(-50%);pointer-events:none;user-select:none;
    filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}
  .ghud{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;
    font-family:var(--disp);font-size:15px;color:#fff;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.5)}
  .gover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(10,31,56,.85);backdrop-filter:blur(6px);color:#fff;text-align:center;padding:20px}
  .lb{width:100%;max-width:280px;margin-top:12px}
  .lbrow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.14);font-size:14px}
  .mt8{margin-top:8px}.mt10{margin-top:10px}.mb8{margin-bottom:8px}.mb10{margin-bottom:10px}.mb12{margin-bottom:12px}
</style>

// ===== helpers =====
const fmtTime=(m)=>{if(m===24*60)return '12AM';let h2=Math.floor(m/60),mi=m%60;const ap=h2>=12&&h2<24?'PM':'AM';h2=h2%12||12;return `${h2}${mi?':'+String(mi).padStart(2,'0'):''}${ap}`;};
const mondayOf=(o=0)=>{const d=new Date();const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day+o*7);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const weekLabel=(m)=>{const[y,mo,d]=m.split('-').map(Number);const a=new Date(y,mo-1,d),b=new Date(y,mo-1,d+6);const f=(x)=>x.toLocaleDateString(undefined,{month:'short',day:'numeric'});return `${f(a)} – ${f(b)}`;};
const dayDate=(m,di)=>{const[y,mo,d]=m.split('-').map(Number);return new Date(y,mo-1,d+di).toLocaleDateString(undefined,{month:'numeric',day:'numeric'});};
const shiftMonday=(m,dw)=>{const[y,mo,d]=m.split('-').map(Number);const n=new Date(y,mo-1,d+dw*7);return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;};
const emptyWeek=()=>({shifts:[],published:false});
const nowStamp=()=>{const d=new Date();return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});};

function App(){

  useEffect(()=>{

  // protected reads — only after the staff member is signed in

    const cm=onSnapshot(D('staffcomments'),(s)=>{setComments(s.exists()?(s.data().list||[]):[]);},()=>{});

    const u2=onSnapshot(D('low_'+store),(s)=>{setLowList(s.exists()?s.data().list:[]);},()=>setConnected(false));

    try{await setDoc(D(key),data);setErr('');flash('Saved ✓');}

  function requireName(){return true;}

  function pressKey(k){
    if(authBusy)return;
    if(pinBad)setPinBad(false);

    const nb=pinBuf+k;

    setAuthBusy(true);setPinBad(false);setLoginErr('');

      // Not signed in — either a first-timer (no account) or a wrong PIN. Ask the function.
      try{
        const r=await fetch(FN_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'register',empId,pin})});
        if(r.ok){
          await signInWithEmailAndPassword(_auth,STAFF_EMAIL(empId),STAFF_PW(pin));
          localStorage.setItem('gc-lastname',loginName);
        }else if(r.status===409){
          setPinBad(true);setPinBuf(''); // account exists -> the PIN was just wrong
        }else{
          const j=await r.json().catch(()=>({}));
          setLoginErr(j.error||'Could not sign in.');setPinBuf('');

    setAuthBusy(false);
  }
  useEffect(()=>{
    const last=localStorage.getItem('gc-lastname');
    if(authReady&&!authed&&!loginName&&last&&allNames.includes(last)){
      setLoginName(last);setPinBuf('');setPinBad(false);

  }
  function logOut(){signOut(_auth);setLoginName(null);setPinBuf('');setPinBad(false);}

  // ---- invoice upload ----
  function compressImage(file){
    return new Promise((res,rej)=>{
      const img=new Image();
      img.onload=()=>{
        const max=2400;
        let w=img.width,h=img.height;
        if(w>max||h>max){const k=max/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k);}
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        cv.toBlob(b=>b?res(b):rej(new Error('compress failed')),'image/jpeg',0.85);
      };
      img.onerror=()=>rej(new Error('could not read image'));
      img.src=URL.createObjectURL(file);
    });
  }
  async function uploadInvoice(file){
    if(!requireName())return;
    setUploading(true);setErr('');
    try{
      const blob=await compressImage(file);
      const id=Date.now().toString(36);
      const path=sref(storage,`invoices/${store}/${id}.jpg`);
      await uploadBytes(path,blob,{contentType:'image/jpeg'});
      const url=await getDownloadURL(path);
      const rec={id,vendorId:null,num:'',total:null,url,by:authed,at:nowStamp(),day:today,applied:false};
      await write('inv_'+store,{list:[rec,...invoices]});
      flash('Invoice uploaded ✓');
    }catch(e){setErr('Upload failed. ('+(e.message||e)+')');}
    setUploading(false);
  }

  // ---- running low ----
  const saveLow=(list)=>{setLowList(list);return write('low_'+store,{list});};
  function toggleLow(name,vend){
    if(!requireName())return;
    const ex=lowList.find(x=>x.name===name);
    if(ex)saveLow(lowList.filter(x=>x.name!==name));
    else saveLow([{id:Date.now().toString(36),name,vend:vend||'',by:authed,at:nowStamp()},...lowList]);
  }
  function addCustomLow(){
    if(!requireName())return;
    const n=lowCustom.trim();
    if(!n)return;
    if(!lowList.find(x=>x.name.toLowerCase()===n.toLowerCase()))
      saveLow([{id:Date.now().toString(36),name:n,vend:'',by:authed,at:nowStamp()},...lowList]);
    setLowCustom('');
  }
  const clearLow=(id)=>saveLow(lowList.filter(x=>x.id!==id));

  // ---- schedule ----
  const saveAvail=(byEmp)=>write(`avail_${store}_${monday}`,{byEmp});
  const employees=emp||SEED;
  const empById=(id)=>employees.find(e=>e.id===id)||{name:'?'};
  const dayShifts=(week.shifts||[]).filter(s=>s.day===day);
  const availFor=(empId,di)=>{const a=avail[empId];if(!a||!a.days||a.days[di]===null||a.days[di]===undefined)return 'none';return a.days[di]?'yes':'no';};
  const meEmp=employees.find(e=>e.name===authed&&(e.role==='cashier'||e.role==='expo'));
  function toggleAvailDay(di){
    if(!meEmp)return;
    const cur=avail[meEmp.id]||{days:[null,null,null,null,null,null,null],notes:{}};
    const days=[...(cur.days||[])];while(days.length<7)days.push(null);
    days[di]=days[di]===true?false:days[di]===false?null:true;
    saveAvail({...avail,[meEmp.id]:{...cur,days}});
  }
  function openNoteDay(di){
    setNoteDay(di===noteDay?null:di);
    setNoteDraft(avail[meEmp.id]?.notes?.[di]||'');
  }
  function saveDayNote(){
    if(!meEmp||noteDay===null)return;
    const cur=avail[meEmp.id]||{days:[null,null,null,null,null,null,null],notes:{}};
    const notes={...(cur.notes||{})};
    if(noteDraft.trim())notes[noteDay]=noteDraft.trim();else delete notes[noteDay];
    saveAvail({...avail,[meEmp.id]:{...cur,notes}});
  }

  // ---- ideas / comments ----
  async function submitIdea(){
    if(comments===null){setErr('Still connecting — try again in a second.');return;}
    const t=ideaTxt.trim();
    if(!t){setErr('Write something first.');return;}
    setIdeaSending(true);setErr('');
    const rec={id:Date.now().toString(36),txt:t,by:ideaAnon?null:authed,store,at:nowStamp()};
    try{
      await setDoc(D('staffcomments'),{list:[rec,...(comments||[])]});
      // email a copy to Angelo (best effort)
      try{
        await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},
          body:JSON.stringify({access_key:'d6ec7d78-c114-427b-868d-b1bbb4f6d28f',
            subject:`💬 Staff comment — ${ideaAnon?'Anonymous':authed} (${STORES.find(s=>s.id===store).label})`,
            from_name:'Gyro City Staff Book',
            message:`From: ${ideaAnon?'Anonymous':authed}\nStore: ${STORES.find(s=>s.id===store).label}\n${new Date().toLocaleString()}\n\n${t}`})});
      }catch{}
      setIdeaTxt('');setIdeaAnon(false);
      flash('Sent to Angelo ✓');
    }catch(e){setErr('Could not send. ('+(e.message||e)+')');}
    setIdeaSending(false);
  }

  // ---- Gyro Catch game ----
  const G_GOOD=['🍅','🥒','🧅','🥩','🍗','🧀','🍋','🫒'];
  function startGame(){
    const st={on:true,over:false,score:0,lives:3,items:[],px:0.5,speed:1,spawn:0,t:performance.now()};
    gRef.current=st;setG({...st});
    cancelAnimationFrame(loopRef.current);
    loopRef.current=requestAnimationFrame(gameTick);
  }
  function gameTick(now){
    const st=gRef.current;
    if(!st||!st.on)return;
    const dt=Math.min(40,now-st.t);st.t=now;
    st.spawn-=dt;
    if(st.spawn<=0){
      st.items.push({id:Math.random(),x:0.08+Math.random()*0.84,y:-0.05,e:G_GOOD[Math.floor(Math.random()*G_GOOD.length)]});
      st.spawn=Math.max(380,950-st.score*14);
    }
    st.speed=1+st.score*0.03;
    const fall=0.00040*st.speed*dt;
    for(const it of st.items)it.y+=fall;
    const keep=[];
    for(const it of st.items){
      if(it.y>=0.90){
        if(Math.abs(it.x-st.px)<0.11){st.score+=1;}
        else{st.lives-=1;}
      }else keep.push(it);
    }
    st.items=keep;
    if(st.lives<=0){
      st.on=false;st.over=true;
      setG({...st});
      const cur=Number(scores?.[authed]||0);
      if(scores!==null&&st.score>cur){
        setDoc(D('gamescores'),{best:{...scores,[authed]:st.score}}).catch(()=>{});
      }
      return;
    }
    setG({...st});
    loopRef.current=requestAnimationFrame(gameTick);
  }
  function movePaddle(e){
    const st=gRef.current;
    if(!st||!st.on)return;
    const r=e.currentTarget.getBoundingClientRect();
    const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
    st.px=Math.max(0.06,Math.min(0.94,cx/r.width));
  }
  useEffect(()=>()=>cancelAnimationFrame(loopRef.current),[]);
  useEffect(()=>{if(tab!=='game'&&gRef.current){gRef.current.on=false;cancelAnimationFrame(loopRef.current);}},[tab]);

          :'Snap every invoice the moment the driver hands it over.'}
      </div>
    <//>`;

  // ---- tab: running low ----

    <${Fragment}>

        Running low on something? <b>Tap it.</b> Tap again if you made a mistake. The ordering team sees it instantly.

        <div class="lbl mt10" key=${cat}>${cat}</div>

          <span class="pill" style="background:var(--tomato)">LOW ✓</span>
        </button>`)}
    <//>`;

    <${Fragment}>
      ${!meEmp&&html`<div class="card center">You're not on the cashier/expo roster at ${STORES.find(s=>s.id===store).label} — availability isn't needed for your role. (Wrong store? Switch above.)</div>`}
      ${meEmp&&html`
        <div style="font-size:14.5px;line-height:1.5;margin:0 2px 10px">
          Tap the days you <b>can work</b> the week of <b>${weekLabel(monday)}</b>. Once = ✓ available · twice = ✕ can't · three times = clear.
        </div>
        <div class="avgrid">
          ${DAYS.map((d,di)=>{
            const st=availFor(meEmp.id,di);
            return html`
              <button class=${'avday '+(st==='yes'?'yes':st==='no'?'no':'')} key=${d} onClick=${()=>toggleAvailDay(di)}>
                ${d}
                <div class="sub">${dayDate(monday,di)}</div>
                <div class="mark">${st==='yes'?'✓':st==='no'?'✕':'·'}</div>
              </button>`;
          })}
        </div>
        <div class="lbl" style="margin:2px 2px 6px">DAY NOTES (OPTIONAL) — TAP A DAY TO ADD ONE</div>
        <div class="chips mb10">
          ${DAYS.map((d,di)=>{
            const has=!!avail[meEmp.id]?.notes?.[di];
            return html`
              <button class=${'chip'+(noteDay===di?' on':'')} style=${has&&noteDay!==di?{borderColor:'var(--amber)',color:'#6E5A1B'}:{}} key=${d} onClick=${()=>openNoteDay(di)}>
                ${d}${has?' ✎':''}
              </button>`;
          })}
        </div>
        ${noteDay!==null&&html`
          <input class="mb10" placeholder=${'Note for '+DAYS[noteDay]+" (e.g. 'only after 4pm')"} value=${noteDraft} onInput=${e=>setNoteDraft(e.target.value)} onBlur=${saveDayNote} />
        `}
        ${Object.keys(avail[meEmp.id]?.notes||{}).length>0&&html`
          <div class="muted" style="margin:0 2px 8px">
            ${DAYS.map((d,di)=>avail[meEmp.id]?.notes?.[di]?html`<div key=${d}><b>${d}:</b> ${avail[meEmp.id].notes[di]}</div>`:null)}
          </div>
        `}
        <div class="muted" style="margin:4px 2px">Day taps save instantly — your manager sees them right away. Notes save when you tap out of the box. Use the ‹ › arrows to set future weeks.</div>
      `}
    <//>`;

  // ---- tab: week schedule ----
  const dayChips=html`
    <div class="days">
      ${DAYS.map((d,di)=>html`
        <button class=${'day'+(day===di?' on':'')} key=${d} onClick=${()=>setDay(di)}>
          ${d}
          <div class="sub">${dayDate(monday,di)}</div>
        </button>`)}
    </div>`;

  const weekTab=week.published?html`
    <${Fragment}>
      ${dayChips}
      <div class="dayhdr">${DAYS[day].toUpperCase()} · STORE HOURS ${DAY_HOURS[day]}</div>
      ${POSITIONS.map(pos=>{
        const shifts=dayShifts.filter(s=>s.position===pos.id);
        if(!shifts.length)return null;
        return html`
          <div class="pos" style=${{borderLeftColor:pos.edge}} key=${pos.id}>
            <div class="pos-h" style=${{background:pos.tint}}>${pos.label.toUpperCase()}</div>
            <div class="pos-b">
              ${shifts.map(s=>html`
                <div class="shift" key=${s.id}>
                  <b style=${s.empId===meEmp?.id?{color:pos.edge}:{}}>${empById(s.empId).name}${s.empId===meEmp?.id?' (you)':''}</b>
                  <span class="t">${fmtTime(s.start)}–${fmtTime(s.end)}</span>
                </div>`)}
            </div>
          </div>`;
      })}
      ${dayShifts.length===0&&html`<div class="center">Nobody scheduled this day.</div>`}
    <//>`
  :html`
    <div class="card center">
      The schedule for <b>${weekLabel(monday)}</b> hasn't been posted yet.<br/>Check back once your manager publishes it.
    </div>`;

  // ---- punch-in screen ----
  if(!authed){
    const dots=[0,1,2,3].map(i=>html`<div class=${'dot'+(pinBuf.length>i?' f':'')} key=${i}></div>`);
    const keypad=html`
      <div class=${'dots'+(pinBad?' bad':'')}>${dots}</div>
      <div class="pad">
        ${[1,2,3,4,5,6,7,8,9].map(k=>html`<button class="key" key=${k} onClick=${()=>pressKey(String(k))}>${k}</button>`)}
        <button class="key ghostk" onClick=${()=>{setLoginName(null);setPinBuf('');setPinBad(false);}}>←</button>
        <button class="key" onClick=${()=>pressKey('0')}>0</button>
        <button class="key ghostk" onClick=${()=>pressKey('back')}>⌫</button>
      </div>`;
    return html`
      <div class="login">
        <h1>GYRO CITY</h1>
        <span class="tag">STAFF BOOK</span>
        <div class="lcard">
          ${!authReady?html`
            <div class="whoami">One second…</div>
            <div class="pinsub">Connecting to Gyro City.</div>
            <div class="dots"><div class="dot f"></div><div class="dot"></div><div class="dot f"></div><div class="dot"></div></div>
          `:!loginName?html`
            <div class="whoami">Who are you?</div>
            <div class="pinsub">Tap your name to punch in.</div>
            <div class="namegrid">
              ${allNames.map(n=>html`<button class=${'chip'+(localStorage.getItem('gc-lastname')===n?' on':'')} key=${n} onClick=${()=>pickLogin(n)}>${n}</button>`)}
            </div>
          `:html`
            <div class="whoami">${loginName}</div>
            <div class="pinsub">
              Enter your 4-digit PIN.<div style="font-size:12px;color:var(--faint);margin-top:2px">First time? The PIN you type becomes yours.</div>${loginErr?html`<div style="color:var(--tomato);font-weight:700;margin-top:4px">${loginErr}</div>`:''}${true?'':
                'Enter the manager PIN to reset someone\u2019s code'}
              ${pinBad?html`<div style="color:var(--tomato);font-weight:700;margin-top:4px">Wrong PIN — try again</div>`:''}
            </div>
            ${keypad}
            ${authBusy&&html`<div class="pinsub" style="margin-top:10px">Signing in…</div>`}
            ${html`
              <div style="text-align:center;margin-top:12px">
                <button class="ghost" style="color:var(--blue);font-weight:600" onClick=${()=>{setLoginName(null);setPinBuf('');setPinBad(false);setLoginErr('');localStorage.removeItem('gc-lastname');}}>Not ${loginName}? Switch name</button>
              </div>
              <div style="text-align:center;margin-top:6px;font-size:12px;color:var(--faint)">Forgot your PIN? Ask a manager to reset it.</div>`}
          `}
        </div>
        ${connected===false&&html`<div class="banner err" style="max-width:420px;margin-top:14px"><b>Can't reach the database.</b> Check internet.</div>`}
      </div>`;
  }

  const myIdeas=(comments||[]).filter(c=>c.by===authed);
  const ideaTab=html`
    <${Fragment}>
      <div class="card">
        <b style="font-size:16px">💬 Comments</b>
        <div class="muted" style="margin:4px 0 10px">Something we should change? A problem nobody's fixing? An idea for the menu? It goes straight to Angelo.</div>
        <textarea style="width:100%;border:1.5px solid var(--line);border-radius:8px;padding:11px;font-size:16px;font-family:inherit;background:#FDFDFB;outline:none;min-height:110px;line-height:1.5" placeholder="Write it here…" value=${ideaTxt} onInput=${e=>setIdeaTxt(e.target.value)}></textarea>
        <label style="display:flex;align-items:center;gap:8px;margin:10px 2px;font-size:14px;color:var(--faint);cursor:pointer">
          <input type="checkbox" style="width:auto" checked=${ideaAnon} onChange=${e=>setIdeaAnon(e.target.checked)} />
          Send anonymously — your name isn't saved or shown anywhere
        </label>
        <button class="btn olive wide" disabled=${ideaSending} onClick=${submitIdea}>${ideaSending?'Submitting…':'Submit — a copy emails Angelo'}</button>
      </div>
      ${myIdeas.length>0&&html`
        <div class="lbl">YOUR PAST SUBMISSIONS</div>
        ${myIdeas.map(c=>html`
          <div class="card" style="padding:11px 14px" key=${c.id}>
            <div style="font-size:14.5px;line-height:1.5;white-space:pre-wrap">${c.txt}</div>
            <div class="mono" style="font-size:11px;color:var(--faint);margin-top:5px">${c.at}</div>
          </div>`)}
      `}
    <//>`;

  const topScores=Object.entries(scores||{}).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const gameTab=html`
    <${Fragment}>
      <div class="card" style="padding:12px 14px">
        <b style="font-size:16px">🎮 Gyro Catch</b>
        <div class="muted" style="margin-top:3px">Slide the pita, catch the ingredients. Miss 3 and it's over. Speed keeps climbing.</div>
      </div>
      <div class="garea" onPointerDown=${movePaddle} onPointerMove=${movePaddle} onTouchStart=${movePaddle} onTouchMove=${movePaddle}>
        ${g.on&&html`
          <div class="ghud"><span>SCORE ${g.score}</span><span>${'❤️'.repeat(g.lives)}</span></div>
          ${g.items.map(it=>html`<div class="gitem" key=${it.id} style=${{left:(it.x*100)+'%',top:(it.y*100)+'%'}}>${it.e}</div>`)}
          <div class="gpaddle" style=${{left:(g.px*100)+'%'}}>🫓</div>
        `}
        ${!g.on&&html`
          <div class="gover">
            ${g.over?html`
              <div style="font-size:20px;font-weight:800">Game over!</div>
              <div style="font-size:34px;font-weight:800;margin:6px 0">${g.score}</div>
              <div style="font-size:13.5px;opacity:.85">${g.score>=(Number(scores?.[authed])||0)&&g.score>0?'New personal best ✨':'Best: '+(scores[authed]||0)}</div>
            `:html`
              <div style="font-size:40px">🥙</div>
              <div style="font-size:19px;font-weight:800;margin:6px 0 2px">Gyro Catch</div>
              <div style="font-size:13.5px;opacity:.85">Your best: ${scores?.[authed]||0}</div>
            `}
            <button class="btn olive" style="margin-top:14px;padding:13px 34px;font-size:16px" onClick=${startGame}>${g.over?'Play again':'START'}</button>
            ${topScores.length>0&&html`
              <div class="lb">
                <div style="font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.12em;opacity:.7;margin-bottom:4px">LEADERBOARD</div>
                ${topScores.map(([n,s],i)=>html`
                  <div class="lbrow" key=${n}><span>${i===0?'🏆 ':''}${n}${n===authed?' (you)':''}</span><b>${s}</b></div>`)}
              </div>`}
          </div>
        `}
      </div>
    <//>`;

  return html`
    <${Fragment}>
      ${header}
      <div class="wrap">
        ${connected===false&&html`<div class="banner err"><b>Can't reach the database.</b> Check your internet connection.</div>`}
        ${err&&html`<div class="banner err">${err}</div>`}
        ${tab==='inv'?invTab:tab==='low'?lowTab:tab==='avail'?availTab:tab==='game'?gameTab:tab==='idea'?ideaTab:weekTab}
      </div>
      ${toast&&html`<div class="toast">${toast}</div>`}
    <//>`;
}

render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
